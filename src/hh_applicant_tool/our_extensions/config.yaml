# Конфиг наших расширений (слот-шаблон + правила анкет).
# ВАЖНО: аккаунт / прокси hh.ru живут в их config.json
# (~/.config/hh-applicant-tool/config.json). Этот YAML — только для слотов и rules.
# Два файла, не мержим.

# Единый источник фактов о соискателе. Используется И письмом (cover.py — для
# ответов на вопросы вакансии в compliance), И резолвером анкет (questions.py).
# Меняешь тут — меняется везде.
profile:
  summary: "senior Python backend, 6+ лет коммерческого опыта, Москва"
  salary: "от 400 тыс. ₽ на руки"
  format: "удалёнка; не готов к офису, гибриду, командировкам и релокации"
  english: "C1"
  citizenship: "РФ"

cover_letter:
  enabled: true
  # Агентная строка (2-й абзац) — статика, гарантированно в каждом письме.
  # Слоты {{greeting}}/{{stack}}/{{hook}}/{{match}} заполняет LLM.
  template: |
    {{greeting}}, Я backend-разработчик на Python с опытом 6+ лет в создании надёжных веб-приложений. Ключевой стек: {{stack}}.

    Помимо продуктовой разработки, выстраивал в команде процессы агентной разработки на AI-инструментах (Cursor, AI-ревью, кодогенерация) — это ускорило разработку и онбординг. Навык, который сейчас становится обязательным для senior-инженера.

    {{hook}} {{match}}

    {{remote_note}}

    {{test_task_note}}

    {{employment_proof_note}}

    Буду рад пообщаться и обсудить детали.
  # Строка вставляется ТОЛЬКО если вакансия требует офис/гибрид (LLM-детект +
  # regex-гард). Если формат удалённый или не указан — не появляется.
  remote_note: "Честно сразу: предпочитаю полностью удалённый формат (офис/гибрид не рассматриваю). Считаю, что senior-уровень и налаженная асинхронная работа делают удалёнку комфортной для команды."
  # Вставляется ТОЛЬКО если вакансия требует выполнить тестовое задание.
  test_task_note: "Один момент по процессу: офлайн-тестовые не выполняю, зато готов показать всё вживую на интервью — лайв-кодинг, разбор архитектурных решений, вопросы по реальным проектам."
  # Вставляется ТОЛЬКО если вакансия требует официальный стаж / по ТК / трудовую.
  employment_proof_note: "По стажу: последние 3 года — официально по ТК РФ, ранее — по договорам ГПХ (договоры на руках)."
  stack_whitelist:
    - Python
    - FastAPI (async)
    - Django
    - SQLAlchemy
    - Pydantic
    - PostgreSQL
    - MySQL
    - ClickHouse
    - Redis
    - Kafka
    - RabbitMQ
    - Celery
    - Airflow
    - LangChain
    - LangGraph
    - pgvector
    - Qdrant
    - S3/MinIO
    - Docker
    - Docker-Compose
    - Kubernetes
    - GitLab CI/CD
    - Nginx
    - Pytest
  default_stack:        # используется в fallback, если LLM упала
    - Python
    - FastAPI (async)
    - PostgreSQL
    - Redis
    - Kafka
    - Docker

questions:
  # YAML-правила резолва вопросов работодателя.
  # match — regex по тексту вопроса (case-insensitive).
  # answer — строка для text-инпута, либо вариант ответа для select/radio.
  #          Спец-значение __llm__ — явно отдать вопрос LLM.
  rules:
    - match: "командировк"
      answer: "Не готов"
    - match: "релока(ция|т)"
      answer: "Не рассматриваю"
    - match: "опыт.*python|python.*опыт|стаж.*python"
      answer: "7 лет"
    - match: "общий стаж|опыт работы.*лет|сколько лет.*опыт"
      answer: "7 лет"
    - match: 'англ\w*\s*язык\w*|уров\w*\s*англ\w*|англ\w*\s*уров\w*|знани\w*\s*англ\w*|владени\w*\s*англ\w*|english'
      answer: "C1"
    - match: 'ожидан\w*.*зарплат|зарплат\w*.*ожидан|желаем\w*.*(зп|зарплат|вознаграждени)'
      answer: "рассматриваю предложения от 400 тыс. руб. на руки"
    - match: "гражданств"
      answer: "РФ"
    - match: "город|местонахожден|где.*наход|откуда"
      answer: "Москва"
    - match: "формат работы|удал(ёнк|енк|енн)|офис|гибрид"
      answer: "Удалёнка"
    - match: 'по\s*ТК|трудов\w*\s+книж|официальн\w*\s+(оформл|трудоустрой|стаж)|бел\w*\s+стаж'
      answer: "Последние 3 года по ТК РФ; ранее по ГПХ, договоры на руках"
    - match: "почему.*(вы|интерес|подходит)"
      answer: __llm__   # явно отдать LLM, даже если правило сматчилось
  fallback: llm        # llm | pause | skip — что делать, если ни одно правило не сматчилось
  # Ответ на открытый вопрос-теста со ссылкой на внешнюю форму (Google Forms и т.п.):
  # бот её не заполняет, вежливо отказывается прямо в поле ответа hh.
  external_form_reply: "Готов пройти ваши этапы, но не заполняю внешние формы — резюме и контакты есть в отклике."

llm:
  provider: local               # local (Ollama) | anthropic (облако) — переключатель
  # --- локальный путь (provider: local) — письма/анкеты/ответы ---
  local_model: qwen2.5:14b-instruct
  local_base_url: http://localhost:11434
  num_predict: 4096             # бюджет генерации (мышление + ответ)
  num_ctx: 12288                # окно контекста: промпт ~3.5к + 4к ответа + запас.
                                # (дефолт gemma4 256K раздувает RAM на гигабайты)
  keep_alive: "30s"             # сколько держать модель в RAM ПОСЛЕ запроса.
                                # 30s: во время прогона не перезагружается, а в
                                # простое (между hourly) выгружается → RAM свободна.
                                # "0" = выгружать после КАЖДОГО вызова (перезагрузка
                                # на каждое письмо — медленно, не рекомендуется).
  # qwen2.5 — НЕ thinking-модель (поэтому НЕТ бага #15260: коллапс текста под
  # format). Под structured output параметр think и так не шлётся; для свободных
  # complete-вызовов анкет шлём think:false, чтобы не-thinking модель не падала.
  think: false
  # --- Anthropic (provider: anthropic; ТАКЖЕ капча в гибриде) ---
  # ключ из ANTHROPIC_API_KEY, прокси из ANTHROPIC_PROXY_URL (.env.example)
  model: claude-haiku-4-5
  max_tokens: 400
  temperature: 0.4

# Ведение переписки с работодателями (команда reply-slot).
# Классификация сообщения — локально (Ollama/Gemma), ответ по сути — Anthropic.
reply:
  # Позиционирование ответа под резюме, по которому пришёл отклик (вариант B).
  # Ключ — id резюме hh (см. `hh-applicant-tool list-resumes`). Опыт общий (один
  # resume.md), различается только подача роли под нишу вакансии. Если id чата нет
  # в карте — берётся `default`. Подаётся в LLM как блок ПОЗИЦИОНИРОВАНИЕ.
  resume_positioning:
    default: "senior Python backend разработчик (6+ лет), с опытом AI/LLM в проде"
    "060bb0abff103e7b970039ed1f783869335666": "senior Python backend разработчик (6+ лет коммерческого опыта на Python/FastAPI)"
    "c321ae99ff10b4bb2f0039ed1f515535474b79": "AI / LLM Engineer с сильным backend-фундаментом: RAG, агентные пайплайны (LangGraph/LangChain), LLM в проде, 6+ лет Python"
  classifier:
    provider: local                      # local = Ollama
    model: qwen2.5:14b-instruct          # не-thinking → нет бага #15260 (коллапс под format)
    base_url: http://localhost:11434
    num_predict: 512                      # JSON-роут крошечный; qwen не-thinking
    num_ctx: 8192                         # окно контекста (промпт классификации мал)
    keep_alive: "30s"
    # think: false                        # раскомментируй, чтобы ВЫКЛЮЧИТЬ thinking у
                                          # классификатора (намного быстрее на каждое сообщение)
  # Бюджет ответа в токенах (Haiku). Мало → длинные анкеты обрезаются, JSON не
  # закрывается → ложная эскалация. Для qwen игнорируется (там num_predict).
  max_tokens: 1024
  # Системка для генерации ответа по сути (route=question). Гарды критичны —
  # это переписка с живыми людьми.
  system_prompt: |
    Ты ведёшь переписку от лица соискателя на hh.ru. Роль/специализация задаётся
    в блоке ПОЗИЦИОНИРОВАНИЕ (он зависит от резюме, по которому пришёл отклик) —
    отвечай строго под неё.
    Отвечай на ПОСЛЕДНЕЕ сообщение работодателя вежливо, по делу, без воды и без
    markdown. Опирайся на ПОЗИЦИОНИРОВАНИЕ, ПРОФИЛЬ и РЕЗЮМЕ соискателя.
    ПОЗИЦИОНИРОВАНИЕ (главное):
    - Всегда подавай опыт как РЕЛЕВАНТНЫЙ вакансии. Смежные домены и технологии
      преподноси как «по сути то же, напрямую переносится»: backend ≈ дата-
      платформа ≈ ML-инфраструктура ≈ MLOps; один фреймворк/очередь/БД ≈ другой
      похожий. Подчёркивай переносимость: «строил backend и инфраструктуру на X —
      это ядро вашей задачи Y».
    - НИКОГДА не отговаривай работодателя и не предлагай «поискать другого
      кандидата»; не принижай опыт, не говори «мой опыт не подходит/отличается».
    - Если конкретного жёсткого факта нет (например, годы на КОНКРЕТНОМ языке,
      которого нет в резюме) — НЕ выдумывай стаж, но и не капитулируй: «прямого
      опыта на X не имею, зато 6+ лет backend и схожая архитектура — войду в X
      быстро». Уверенно, без самоуничижения.
    ЖЁСТКИЕ ПРАВИЛА:
    - Формат работы: только удалёнка. Офис, гибрид, командировки, релокацию — НЕ
      принимать; вежливо обозначить, что работаешь удалённо.
    - Зарплату называть только из профиля, не торговаться вслепую.
    - Никаких твёрдых обещаний по срокам, тестовым, датам.
    - Подпись — только имя «Ян» (без отчества и фамилии).
    - escalate=true ставь ТОЛЬКО если это оффер / обсуждение конкретных условий
      сделки / что-то, требующее личного решения соискателя, ИЛИ нужны личные
      данные, которых нет в профиле/резюме. НЕ ставь escalate из-за того, что
      опыт совпал не на 100% — в этом случае отвечай сам, мостя опыт к вакансии.
    Верни строго JSON: {"reply": "<текст ответа>", "escalate": false}.
  instruction: "Ответь на последнее сообщение работодателя."
  # Концептуальное тестовое (ответ текстом, без кода) → отвечает Haiku.
  #   auto  — авто-отправка ответа в чат (по умолчанию);
  #   draft — черновик тебе на подтверждение (в чат НЕ шлём, отправляешь сам).
  conceptual_test_mode: auto
  conceptual_max_tokens: 2048   # «2-3 слайда» длиннее обычного чата
  conceptual_instruction: "Это концептуальное тестовое задание. Дай развёрнутый структурированный технический разбор: как бы ты решал задачу — подход, ключевые шаги, инструменты и технологии, на что обратить внимание. Несколько абзацев, по делу. Только факты из резюме, без выдумок."
  # Фикс-ответ, когда работодатель просит перейти по внешней ссылке / заполнить форму.
  external_link_reply: "Спасибо! По внешним ссылкам не перехожу и формы/боты не заполняю. Готов ответить на все вопросы голосом на собеседовании — резюме и контакты есть в отклике."
  # Фикс-ответ на просьбу выполнить тестовое задание.
  test_task_reply: "Спасибо за интерес к моей кандидатуре! Тестовые задания я не выполняю — ценю и своё, и ваше время. При этом с радостью подтвержу компетенции на собеседовании: готов к лайв-кодингу, разбору архитектуры и любым вопросам по реальному опыту."
  # Фикс-ответ на просьбу ПОДТВЕРДИТЬ официальный стаж / по ТК (на словах).
  # Просьбу ПРИСЛАТЬ документы (route document_request) бот не отвечает — эскалирует тебе.
  employment_proof_reply: "По оформлению: последние 3 года работаю официально по ТК РФ. Более ранний опыт — по договорам ГПХ, оригиналы на руках."
  # Фикс-ответ на вопрос о юридической чистоте (судимость / ФССП / банкротство / проверка СБ).
  legal_clearance_reply: "Судимостей, задолженностей в ФССП и банкротств не имею — юридически полностью чист."
  # Многоходовый диалог с ботом (только на route=question): после ответа ждём
  # новое сообщение работодателя и отвечаем снова, до max_turns ходов.
  max_turns: 5
  poll_timeout_sec: 25      # сколько ждать ответа бота в чате
  poll_interval_sec: 5      # как часто перепроверять чат
